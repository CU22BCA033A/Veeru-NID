<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · NID Prep Studio</title>
<style>
  :root { --bg:#f7f5f0; --ink:#1d1b18; --ink2:#5d574e; --accent:#d9481c; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151412; --ink:#f1ede6; --ink2:#b3aca1; --accent:#ef6a3c; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:26rem; padding:24px 16px; text-align:center; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight:500; font-size:2rem; margin:16px 0 8px; }
  p { color:var(--ink2); margin:0 0 12px; }
  a { display:inline-flex; align-items:center; min-height:44px; padding:0 20px; margin-top:8px; border-radius:12px;
      background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.8M19 12.9a10 10 0 0 0-2-1.5M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8A15 15 0 0 0 10.7 5M2 2l20 20"/></svg>

  <p>Pages you opened before still work. Answers you submit while offline are saved on this phone and sent when the connection is back.</p>

</main>
</body>
</html>
